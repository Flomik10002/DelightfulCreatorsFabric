plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Greenhouse Maven"
		url = 'https://maven.greenhouse.lgbt/releases/'
	}
	maven {
		url "https://jitpack.io/" // Fabric ASM
		content {
			excludeGroup "io.github.fabricators_of_create"
		}
	}
	maven {
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
		content { includeGroup "fuzs.forgeconfigapiport" }
	}
	maven {
		url = "https://maven.blamejared.com"
		content { includeGroup "mezz.jei" }
	}
}

dependencies {

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings() //"net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Core integrations used by the Mechanical Cutter. On this Minecraft version the Fabric port of
	// Create is Create Fly, which repackages Create, Ponder and Flywheel under com.zurrtum.create.
	modImplementation "maven.modrinth:create-fly:${project.create_version}"
	modImplementation("vectorwing:FarmersDelight:${fdrf_version}") {
		exclude(group: "net.fabricmc")
	}
	// Used directly for the server-side Mechanical Cutter setting.
	modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

	// JEI is optional for players. Its APIs are needed to compile the integration, while the full
	// runtime is only enabled for local smoke tests with -Penable_jei_runtime=true.
	modCompileOnlyApi "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	// Client-synced recipes live in JEI's own runtime; the plugin needs them because the vanilla
	// client no longer keeps a recipe manager of its own. Compile-time only, exactly like the API.
	modCompileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") {
		transitive = false
	}
	// JEI's class files carry jspecify type annotations; javac needs them on the classpath.
	compileOnly "org.jspecify:jspecify:1.0.0"
	if (project.findProperty("enable_jei_runtime") == "true") {
		modLocalRuntime "maven.modrinth:jei:${project.jei_version}"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
