plugins {
	id 'fabric-loom' version '1.10.+'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven { url = "https://jitpack.io" }
		}
		filter {
			includeGroup "com.github.Chocohead"
		}
	}
	maven {
		url = "https://maven.greenhouse.lgbt/releases"
		content { includeGroup "vectorwing" }
	}
	exclusiveContent {
		forRepository {
			maven { url = "https://mvn.devos.one/snapshots" }
		}
		filter {
			includeGroup "com.simibubi.create"
			includeGroup "com.tterrag.registrate_fabric"
			includeGroup "io.github.tropheusj"
		}
	}
	exclusiveContent {
		forRepository {
			maven { url = "https://mvn.devos.one/releases" }
		}
		filter {
			includeGroupByRegex "io\\.github\\.fabricators_of_create\\.Porting-Lib.*"
		}
	}
	maven {
		url = "https://maven.createmod.net"
		content {
			includeGroupAndSubgroups "net.createmod"
			includeGroupAndSubgroups "dev.engine-room"
		}
	}
	maven {
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
		content { includeGroup "fuzs.forgeconfigapiport" }
	}
	maven {
		url = "https://maven.jamieswhiteshirt.com/libs-release"
		content { includeGroup "com.jamieswhiteshirt" }
	}
	maven {
		url = "https://maven.blamejared.com"
		content { includeGroup "mezz.jei" }
	}
}

dependencies {

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Core integrations used by the Mechanical Cutter.
	modImplementation("com.simibubi.create:create-fabric:${project.create_version}") {
		// Ponder 1.0.91 still advertises an older split Flywheel API jar. Create ships the
		// complete, matching Flywheel 1.0.5 runtime, so keeping both only creates duplicate classes.
		exclude group: "dev.engine-room.flywheel", module: "flywheel-fabric-api-1.20.1"
	}
	// The official Maven metadata also exposes FDRF's Porting Lib and Fabric-ASM
	// dependencies to Loom's remapped development runtime.
	modImplementation "vectorwing:FarmersDelight:${project.fdrf_version}"
	// Used directly for the server-side Mechanical Cutter setting. Create also brings this
	// dependency transitively, but declaring it here keeps our own API usage explicit.
	modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

	// JEI is optional for players. Its APIs are needed to compile the integration, while the full
	// runtime is enabled explicitly for local smoke tests with -Penable_jei_runtime=true.
	modCompileOnlyApi "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	if (project.findProperty("enable_jei_runtime") == "true") {
		// JEI's Fabric jar is self-contained. Its POM also exposes Mojmap common modules;
		// letting Loom remap both copies of the API produces a broken mixed-namespace jar.
		modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") {
			transitive = false
		}
	}

	// Uncomment the following line to enable the deprecated Fabric API modules.
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def archiveName = base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${archiveName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
